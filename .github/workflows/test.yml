name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: github-action
      - run: npm audit --audit-level=high
      - run: npm audit --prefix github-action --omit=dev --audit-level=high
      - run: node scripts/scan-secrets.js
      - run: node scripts/check-public-release.js
      - run: npm run check
      - name: Write redacted CI summary
        if: always()
        env:
          CI_RESULT: ${{ job.status }}
        run: node scripts/write-ci-report.js
      - name: Upload CI summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-summary.json
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node scripts/review-dependencies.js

name: Sync trusted DNS policy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flareform-policy-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dns-policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/sync-config.js --validate --config-dir config
      - run: node scripts/sync-config.js --dry-run --config-dir config
      - name: Apply policy to D1
        run: >-
          node scripts/sync-config.js --apply --config-dir config
          --account-id "$FLAREFORM_CF_ACCOUNT_ID"
          --database-id "$FLAREFORM_D1_DATABASE_ID"
          --confirm-remote
        env:
          FLAREFORM_CF_ACCOUNT_ID: ${{ secrets.FLAREFORM_CF_ACCOUNT_ID }}
          FLAREFORM_D1_DATABASE_ID: ${{ secrets.FLAREFORM_D1_DATABASE_ID }}
          FLAREFORM_D1_ADMIN_TOKEN: ${{ secrets.FLAREFORM_D1_ADMIN_TOKEN }}
